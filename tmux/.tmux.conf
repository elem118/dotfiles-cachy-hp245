set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"

# an attempt to fix the nvim ghost cursor issue
# set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

set-option -g focus-events on

set -g history-limit 50000
set -sg escape-time 10

# Enable vi mode for copy mode and command prompt
setw -g mode-keys vi
set -g status-keys vi

# Enable mouse mode
set -g mouse on

# ...or, more traditional: navigate with prefix + hjkl (keeps arrow keys working too)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane splitting with vim-like mnemonics
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Copy mode: vim-style selection and yank (requires tmux 2.4+)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set ctrl space as the default prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# toggle pane zoom
bind + resize-pane -Z

bind x kill-pane
bind z kill-window

bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"
# bind-key r command-prompt -I "#T" "select-pane -T '%%'"

#integrate copy mode with system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

#create new floating pane
bind-key f display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
# bind-key f display-popup -E -d "#{pane_current_path}" -w 500 -h 500

set -g status-style "bg=teal,fg=black"
# set -ug status-style

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
